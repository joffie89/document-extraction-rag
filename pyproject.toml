[project]
name = "document-extraction-rag"
version = "0.1.0"
description = "Local document extraction and RAG workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "chromadb>=1.5,<2",
    "docling[rapidocr]>=2.123,<3",
    "dynaconf>=3.2,<4",
    "fastapi>=0.135,<1",
    "markdown-it-py>=4,<5",
    "openai>=3.5,<4",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2.0,<3",
    "tiktoken>=0.12,<1",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "uvicorn>=0.41,<1",
]

[project.optional-dependencies]
full = [
    "docling[asr,xbrl]>=2.123,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/backend/src/document_rag"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["apps/backend/src"]
testpaths = ["apps/backend/tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["apps/backend/src", "apps/backend/tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
